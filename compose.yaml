services:
    app:
        build: .
        restart: unless-stopped
        ports:
            - "127.0.0.1:8000:8000"
        environment:
            APP_ENV: production
            APP_KEY: ${APP_KEY:?generate one with php artisan key:generate --show}
            APP_URL: http://localhost:8000
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_DATABASE: mydb
            DB_USERNAME: user
            DB_PASSWORD: userpassword
        depends_on:
            - mysql

    mysql:
        image: docker.io/library/mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: mydb
            MYSQL_USER: user
            MYSQL_PASSWORD: userpassword
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro

volumes:
    mysql_data:
