services:
    app:
        build: .
        restart: unless-stopped
        ports:
            - "8000:8000"
        environment:
            APP_ENV: production
            APP_KEY: ${APP_KEY:?generate one with php artisan key:generate --show}
            APP_URL: http://localhost:8000
        volumes:
            - geoma_db:/app/storage/db

volumes:
    geoma_db:
        name: geoma_db
